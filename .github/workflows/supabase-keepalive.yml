# Keeps the Supabase Free-plan project from being auto-paused for inactivity.
# Supabase only counts requests that go through the project's API, so this
# calls the REST API (a one-row read) every 6 hours.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (4 times a day)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST API
        env:
          # Public values: the publishable key is meant for client code and every table has RLS on.
          SUPABASE_URL: https://lfogukqfdjnqztprezvu.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_YaJ3Jkej-cwrycRNhjq90w_Ro9zywOB
        run: |
          for attempt in 1 2 3; do
            status=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
              "$SUPABASE_URL/rest/v1/services?select=id&limit=1" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY") || status=000
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
              echo "Supabase is awake."
              exit 0
            fi
            cat /tmp/body.txt || true
            sleep 30
          done
          echo "::error::Supabase did not respond with 2xx (the project may be paused). Resume it in the Supabase dashboard."
          exit 1
